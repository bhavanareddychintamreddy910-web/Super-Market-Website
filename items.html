<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHAVANA MART - Items</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="items-page">

  <header class="navbar">
    <a href="index.html" class="logo">BHAVANA MART</a>
    <nav>
      <a href="index.html" target="_blank">Home</a>
      <a href="about.html" target="_blank">About</a>
      <a href="items.html" target="_blank">Items</a>
      <a href="contact.html" target="_blank">Contact</a>
      <a href="cart.html" target="_blank" class="cart-link">🛒 Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <div class="container">
    <section class="glass-panel">
      <h1>Our Products</h1>
      <p>Explore our wide selection of fresh groceries, household supplies, and daily essentials.</p>

      <div class="category-tabs">
        <button class="tab-btn active" onclick="filterCategory('all')">All Items</button>
        <button class="tab-btn" onclick="filterCategory('produce')">Fresh Produce</button>
        <button class="tab-btn" onclick="filterCategory('dairy')">Dairy & Bakery</button>
        <button class="tab-btn" onclick="filterCategory('beverages')">Beverages</button>
        <button class="tab-btn" onclick="filterCategory('snacks')">Snacks</button>
      </div>

      <div class="product-grid" id="product-list">
        <!-- Products generated dynamically via script.js -->
      </div>
    </section>
  </div>

  <footer>
    <p>&copy; 2026 BHAVANA MART. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
